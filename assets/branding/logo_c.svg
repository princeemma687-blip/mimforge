<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Mimforge logo C: "Machine frame" — a gantry outline with one glowing motion-path dot inside -->
  <rect x="6" y="6" width="244" height="244" rx="52" fill="#17191D" stroke="#2E333B" stroke-width="2"/>
  <!-- gantry frame -->
  <g stroke="#DCE9ED" stroke-width="12" stroke-linecap="square" fill="none">
    <path d="M58 82h140"/>
    <path d="M72 82v108M184 82v108"/>
    <path d="M54 190h36M166 190h36"/>
  </g>
  <!-- carriage riding the top beam -->
  <rect x="146" y="68" width="26" height="28" rx="4" fill="#DCE9ED"/>
  <!-- motion path the machine will travel -->
  <path d="M86 166C106 122 132 152 158 116" fill="none" stroke="#00E5FF" stroke-width="5" stroke-linecap="round" stroke-dasharray="1 13"/>
  <circle cx="86" cy="166" r="5" fill="#00E5FF" opacity="0.55"/>
  <!-- the glowing point on the path -->
  <circle cx="158" cy="116" r="21" fill="#00E5FF" opacity="0.28"/>
  <circle cx="158" cy="116" r="10" fill="#00E5FF"/>
</svg>
