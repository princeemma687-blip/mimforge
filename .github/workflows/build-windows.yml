# Mimforge — Windows installer build (CI twin of setup/build-windows.ps1)
#
# Runs the SAME steps as the laptop script, in the same order:
#   1. venv + pip install -e . + pip install pyinstaller pytest
#   2. FULL pytest suite as a gate -- the build stops if tests fail
#   3. PyInstaller with mimforge.spec -> dist\Mimforge\Mimforge.exe
#   4. Inno Setup (iscc) with setup\mimforge.iss -> dist\Mimforge-Setup-0.0.1.exe
#   5. The installer .exe is uploaded as the `mimforge-windows-installer`
#      artifact. If the Inno step fails but the PyInstaller dist exists,
#      the dist folder is uploaded instead as `mimforge-windows-dist-fallback`.
#
# Triggers: manual (workflow_dispatch) and any push that changes THIS
# file only -- ordinary code pushes do not rebuild the installer.
# A CI build is NOT an install test: the clean-profile install test
# still happens on a real Windows machine (see docs/PACKAGING.md).

name: Build Windows installer

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/build-windows.yml

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg (the test gate needs ffprobe/ffmpeg on PATH)
        shell: pwsh
        run: |
          choco install ffmpeg -y
          if ($LASTEXITCODE -ne 0) { throw "choco install ffmpeg failed." }

      - name: Create venv and install app + build tools
        shell: pwsh
        run: |
          python -m venv .venv
          if ($LASTEXITCODE -ne 0) { throw "venv creation failed." }
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { throw "pip upgrade failed." }
          .\.venv\Scripts\python.exe -m pip install -e .
          if ($LASTEXITCODE -ne 0) { throw "pip install -e . failed." }
          .\.venv\Scripts\python.exe -m pip install pyinstaller pytest
          if ($LASTEXITCODE -ne 0) { throw "pip install pyinstaller pytest failed." }
          # Packaging-time DATA SOURCE only (never shipped, never
          # imported by the app): its espeak lexicon.db is converted
          # into the bundled phoneme lexicon by the fetch step
          # (Stage 2 narration).
          .\.venv\Scripts\python.exe -m pip install gruut-lang-en
          if ($LASTEXITCODE -ne 0) { throw "pip install gruut-lang-en failed." }

      - name: Stage bundled runtime assets (ffmpeg, SAM, Whisper, Piper + Kokoro voices, config)
        shell: pwsh
        env:
          # The app's public Firebase web config (identifiers, not
          # secrets -- the per-user Firestore rules are the
          # security), supplied as repository VARIABLES so the
          # generated bundled config resource can be produced in
          # CI. The fetch script never prints the values. Until
          # the variables are set, this step stages everything
          # else and warns; the frozen self-test gate below then
          # fails the build on the missing config, by design.
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ vars.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ vars.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
        run: |
          .\.venv\Scripts\python.exe setup\fetch_bundled_assets.py --platform win64
          if ($LASTEXITCODE -ne 0) { throw "Bundled-asset staging failed -- build stopped." }

      - name: Run the FULL pytest suite (build gate)
        shell: pwsh
        env:
          # Same headless Qt platform the suite is verified with locally.
          QT_QPA_PLATFORM: offscreen
        run: |
          .\.venv\Scripts\python.exe -m pytest -q
          if ($LASTEXITCODE -ne 0) { throw "Tests failed -- build stopped. Fix the failures before packaging." }

      - name: Build with PyInstaller
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe -m PyInstaller --noconfirm mimforge.spec
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller build failed." }
          if (-not (Test-Path "dist\Mimforge\Mimforge.exe")) { throw "Expected dist\Mimforge\Mimforge.exe was not produced." }

      - name: Self-test the frozen app (missing-module gate)
        shell: pwsh
        env:
          # Headless Qt, same as the test gate: the self-test builds
          # the real main window offscreen and exits.
          QT_QPA_PLATFORM: offscreen
        run: |
          # The shipped exe is windowed (no console), so launch it
          # with Start-Process -Wait and gate on the exit code. The
          # self-test imports the full module graph and constructs
          # the main window: a module missing from the bundle (the
          # 2026-11-26 scipy crash) fails HERE, before packaging,
          # instead of on the user's laptop. Since Stage 0 (Gate
          # v2) the frozen self-test ALSO runs the real-flow
          # probes: bundled ffmpeg/ffprobe, SAM weights, Whisper
          # model, Firebase config and the sample clip, exercised
          # with a scrubbed PATH -- a resource missing from the
          # bundle fails here too.
          $proc = Start-Process -FilePath "dist\Mimforge\Mimforge.exe" -ArgumentList "--self-test" -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "Frozen-app self-test failed with exit code $($proc.ExitCode) -- a module is missing from the bundle. Do not package this build." }

      - name: Build installer with Inno Setup
        id: inno
        shell: pwsh
        run: |
          Write-Host "Locating the Inno Setup compiler (ISCC.exe) ..."
          $innoDirs = @(
            "C:\Program Files (x86)\Inno Setup 6",
            "C:\Program Files\Inno Setup 6",
            (Join-Path $env:LOCALAPPDATA "Programs\Inno Setup 6"),
            "C:\ProgramData\chocolatey\bin"
          )
          $fromPath = Get-Command iscc.exe -ErrorAction SilentlyContinue
          if ($fromPath) { Write-Host "Get-Command iscc.exe -> $($fromPath.Source)" } else { Write-Host "Get-Command iscc.exe -> not on PATH" }
          foreach ($dir in $innoDirs) {
            $probe = Join-Path $dir "ISCC.exe"
            Write-Host "Test-Path $probe -> $(Test-Path $probe)"
          }
          $iscc = $null
          if ($fromPath) { $iscc = $fromPath.Source }
          if (-not $iscc) {
            foreach ($dir in $innoDirs) {
              $candidate = Join-Path $dir "ISCC.exe"
              if (Test-Path $candidate) { $iscc = $candidate; break }
            }
          }
          if (-not $iscc) {
            $reg = Get-ItemProperty "HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\Inno Setup 6_is1" -ErrorAction SilentlyContinue
            if ($reg -and $reg."Inno Setup: App Path") {
              $candidate = Join-Path $reg."Inno Setup: App Path" "ISCC.exe"
              Write-Host "Registry App Path probe: $candidate -> $(Test-Path $candidate)"
              if (Test-Path $candidate) { $iscc = $candidate }
            }
          }
          if (-not $iscc) {
            Write-Host "ISCC.exe not found yet -- installing Inno Setup with Chocolatey ..."
            choco install innosetup -y
            if ($LASTEXITCODE -ne 0) { throw "choco install innosetup failed." }
            $fromPath = Get-Command iscc.exe -ErrorAction SilentlyContinue
            if ($fromPath) { $iscc = $fromPath.Source }
            if (-not $iscc) {
              foreach ($dir in $innoDirs) {
                $candidate = Join-Path $dir "ISCC.exe"
                if (Test-Path $candidate) { $iscc = $candidate; break }
              }
            }
          }
          if (-not $iscc) { throw "ISCC.exe not found: not on PATH, not in any standard Inno Setup folder, and not after choco install." }
          Write-Host "Using ISCC: $iscc (file version $((Get-Item $iscc).VersionInfo.FileVersion))"
          & $iscc "setup\mimforge.iss"
          $isccExit = $LASTEXITCODE
          if ($isccExit -ne 0) { throw "Inno Setup build failed with exit code $isccExit." }
          if (-not (Test-Path "dist\Mimforge-Setup-0.0.1.exe")) { throw "Expected dist\Mimforge-Setup-0.0.1.exe was not produced." }

      - name: Upload the Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: mimforge-windows-installer
          path: dist/Mimforge-Setup-0.0.1.exe
          if-no-files-found: error

      - name: Upload the PyInstaller dist as fallback (installer step failed)
        if: ${{ failure() && steps.inno.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: mimforge-windows-dist-fallback
          path: dist/Mimforge
          if-no-files-found: ignore
