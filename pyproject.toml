[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mimforge"
version = "0.0.1"
description = "Create teaching machines from teacher demonstration videos (generic, practical-agnostic core schema)."
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6",
    "cryptography>=42",
    "opencv-python-headless>=5",
    "faster-whisper>=1.2",
    # av is faster-whisper's audio decoder: 13.1.0 is the newest version
    # whose cp312 wheel installs here AND that still accepts the
    # `metadata_errors` argument faster-whisper 1.2.1 passes (19.x removed
    # it; 14.4.0 ships no cp312 wheel on this index).
    "av==13.1.0",
    "numpy>=1.26",
    # Runtime need via build123d, which imports scipy at module
    # load. Declared explicitly since 2026-11-26 (not left as an
    # accidental transitive): the frozen run #6 build excluded it
    # and crashed on launch with "No module named 'scipy'".
    "scipy>=1.14",
    "build123d>=0.13",
    "mujoco>=3",
    # Runtime need via MuJoCo, whose software-GL backend (the
    # machine view's offscreen renderer, Stage 1) imports PyOpenGL
    # when its context is created. Declared explicitly since
    # 2026-11-26: left as an accidental transitive, it was missing
    # from the frozen bundle's collection and the Stage 1
    # clean-room self-test failed at renderer creation.
    "PyOpenGL>=3.1",
    # Direct dependency since 2026-11-26: the SAM 2.1 click tracker
    # runs its encoder/decoder ONNX graphs on it (it also arrives
    # transitively via faster-whisper).
    "onnxruntime>=1.20",
]

[project.scripts]
mimforge = "mimforge.ui.main_window:run"

[project.optional-dependencies]
dev = ["pytest>=8"]
# Packaging-time DATA SOURCE only: setup/fetch_bundled_assets.py
# reads gruut-lang-en's espeak lexicon.db (SQLite, via stdlib) and
# converts it into the bundled phoneme lexicon for the narration
# voices. The app never imports gruut and it is never shipped.
packaging = ["gruut-lang-en>=2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"mimforge.templates" = ["*.json", "*.xml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: tests that download a model or take over a minute",
]
