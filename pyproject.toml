[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mimforge"
version = "0.0.1"
description = "Create teaching machines from teacher demonstration videos (generic, practical-agnostic core schema)."
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"mimforge.templates" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
